name: Build K60 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git flex bison libssl-dev libelf-dev bc cpio rsync wget

      - name: Clone Clang r450784e
        run: |
          # 直接克隆整个工具链仓库
          git clone --depth=1 https://github.com/snove520/clang-r450784e.git clang
          
          # 查找真正的 bin 目录（防止工具链嵌套太深）
          CLANG_BIN_DIR=$(find $GITHUB_WORKSPACE/clang -name "clang" -type f -executable | head -n 1 | xargs dirname)
          
          # 设置权限，并把真实路径存到环境变量中供下一步使用
          chmod +x $CLANG_BIN_DIR/*
          echo "REAL_CLANG_BIN=$CLANG_BIN_DIR" >> $GITHUB_ENV

      - name: Configure and Build Kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          
          # 【关键修复】直接使用上一步存入的全局环境变量，不要用
          export PATH="$REAL_CLANG_BIN:$PATH"
          
          # 打印验证一下，确保 clang 和 ld.lld 都找得到
          echo "--- Checking Toolchain ---"
          which clang
          which ld.lld
          clang --version
          echo "--------------------------"
          
          # 配置编译
          make O=out ARCH=arm64 gki_defconfig
          
          # 【关键修复】去掉了 savedefconfig，直接开始编译！
          make O=out ARCH=arm64 -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: K60-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
