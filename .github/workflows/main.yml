name: Build K60 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git git-lfs flex bison libssl-dev libelf-dev bc cpio rsync wget unzip curl

      - name: Download Clang from Release
        run: |
          mkdir -p clang && cd clang
          
          # 【关键】使用 curl 下载，增加重试机制。如果网络断开，会自动重新尝试
          echo "Downloading Clang zip, please wait..."
          curl -L -f -O --retry 10 --retry-delay 5 --retry-max-time 300 https://github.com/Can186/RedmiK60Pro/releases/download/clang/clang-r450784e-main.zip
          
          echo "Download finished, unzipping..."
          unzip -q clang-r450784e-main.zip
          
          # 提取文件并清理压缩包
          mv clang-r450784e-main/* .
          rm -rf clang-r450784e-main clang-r450784e-main.zip
          
          # 赋予执行权限
          chmod +x bin/*
          echo "Clang setup complete!"

      - name: Configure and Build Kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          
          # 指向解压后的 clang/bin
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # 验证工具链
          echo "--- Checking Toolchain ---"
          which clang
          which ld.lld
          clang --version
          echo "--------------------------"
          
          # 配置（使用 gki_defconfig）
          make O=out ARCH=arm64 gki_defconfig
          
          # 满核多线程编译（-j 后面会自动使用 GitHub 服务器的所有核心）
          make O=out ARCH=arm64 -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: K60-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
