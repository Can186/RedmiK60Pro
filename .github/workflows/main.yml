name: Build K60 Kernel

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git flex bison libssl-dev libelf-dev bc cpio rsync wget unzip

      - name: Clone Clang from ArrowOS GitLab
        run: |
          # 直接克隆 GitLab 仓库（不加 --depth=1 防止浅克隆丢掉文件）
          git clone https://gitlab.com/arrowos-project/android_prebuilts_clang_host_linux-x86_clang-r450784e.git clang
          
          cd clang
          
          # 验证架构：必须输出 x86-64！如果输出 aarch64 就说明还是错的
          file bin/clang-14
          
          # 赋予权限
          chmod +x bin/*
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git flex bison libssl-dev libelf-dev bc cpio rsync wget unzip dwarves

      - name: Configure and Build Kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # 修复缺失文件
          sed -i 's/source "drivers\/misc\/hwid\/Kconfig"/# &/' drivers/misc/Kconfig
          
          # 生成基础配置
          make O=out ARCH=arm64 gki_defconfig
          
          # 【调整 LTO 策略】保留 THIN LTO 提升性能，坚决关闭最容易爆内存的 FULL LTO
          ./scripts/config --file out/.config --enable LTO_CLANG
          ./scripts/config --file out/.config --enable LTO_CLANG_THIN
          ./scripts/config --file out/.config --disable LTO_CLANG_FULL
          
          # 重新同步配置（防止被覆盖）
          make O=out ARCH=arm64 olddefconfig
          
          # 检查最终状态
          echo "--- Checking LTO Status ---"
          grep "CONFIG_LTO_CLANG" out/.config || echo "No LTO found"
          
          # 【极其关键】为了防止 OOM，把编译线程数降到最低的 -j1 或 -j2
          # 这会多花些时间，但是最有机会扛过 LTO 链接阶段
          make O=out ARCH=arm64 -j1

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: K60-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
