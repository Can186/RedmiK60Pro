name: Build K60 Kernel

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git flex bison libssl-dev libelf-dev bc cpio rsync wget unzip

      - name: Download Clang via wget
        run: |
          mkdir -p clang && cd clang
          
          # 【关键】用 wget 直接下载你的 Release 链接
          # 加上 --tries=5 防止网络抽风断流
          wget -q --tries=5 --timeout=60 -O clang-r450784e-main.zip https://github.com/Can186/RedmiK60Pro/releases/download/clang/clang-r450784e-main.zip
          
          unzip -q clang-r450784e-main.zip
          mv clang-r450784e-main/* .
          rm -rf clang-r450784e-main clang-r450784e-main.zip
          
          # 赋予权限并验证
          chmod +x bin/*
          ls -la bin/clang

      - name: Configure and Build Kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          
          # 指向解压出来的 clang 目录
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # 打印验证
          echo "--- Checking Toolchain ---"
          which clang
          which ld.lld
          clang --version
          echo "--------------------------"
          
          # 配置编译
          make O=out ARCH=arm64 gki_defconfig
          
          # 满核编译
          make O=out ARCH=arm64 -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: K60-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
