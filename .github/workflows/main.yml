name: Build K60 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git flex bison libssl-dev libelf-dev bc cpio rsync wget unzip

      - name: Download Official AOSP Clang
        run: |
          mkdir -p clang && cd clang
          
          # 加上 -L 跟随重定向，加 --header 防止被 Google 拒绝
          wget -q -L -O clang.tar.gz \
            --header="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784e.tar.gz
          
          # 解压
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          
          # 验证架构（在 GitHub 服务器上必须输出 x86-64）
          file bin/clang-14
          
          # 赋予权限
          chmod +x bin/*

      - name: Configure and Build Kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          echo "--- Checking Toolchain ---"
          clang --version
          ld.lld --version
          echo "--------------------------"
          
          # 配置并编译
          make O=out ARCH=arm64 gki_defconfig
          make O=out ARCH=arm64 -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: K60-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
