name: Build K60 Kernel

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies & Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git git-lfs flex bison libssl-dev libelf-dev bc cpio rsync wget unzip
          # 必须初始化 LFS，否则下下来的只是指针文件
          git lfs install

      - name: Clone and Setup Clang
        run: |
          # 克隆仓库
          git clone https://github.com/snove520/clang-r450784e.git clang
          cd clang
          
          # 强制拉取 LFS 真实文件（这一步是关键）
          git lfs pull
          
          # 很多时候仓库里会套一层文件夹，自动找一下 bin
          BIN_DIR=$(find . -name "clang" -type f -executable | head -n 1 | xargs dirname)
          echo "REAL_BIN_DIR=$PWD/$BIN_DIR" >> $GITHUB_ENV
          
          # 检查文件架构
          file $BIN_DIR/clang-14
          
          chmod +x $BIN_DIR/*

      - name: Configure and Build Kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          
          export PATH="$REAL_BIN_DIR:$PATH"
          
          echo "--- Checking Toolchain ---"
          clang --version
          ld.lld --version
          echo "--------------------------"
          
          make O=out ARCH=arm64 gki_defconfig
          make O=out ARCH=arm64 -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: K60-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
