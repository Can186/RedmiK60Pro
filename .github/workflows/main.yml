name: Build K60 Kernel

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies & Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git git-lfs flex bison libssl-dev libelf-dev bc cpio rsync wget unzip
          # 【关键】必须安装并初始化 Git LFS，否则拉下来的只是小体积的指针文件
          git lfs install

      - name: Clone Clang from My Repo
        run: |
          # 直接克隆你的仓库。使用 git lfs pull 确保大文件下载下来
          git clone --depth=1 https://github.com/Can186/clang-r450784e.git clang
          cd clang
          git lfs pull
          
          # 检查一下 clang 到底在哪一层。如果是直接在根目录的 bin 下：
          if [ -d "bin" ]; then
            chmod +x bin/*
            echo "REAL_CLANG_BIN=$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_ENV
          else
            # 如果是套了一层文件夹（比如 clang-r450784e/bin），我们自动找出来
            BIN_DIR=$(find . -name "clang" -type f -executable | head -n 1 | xargs dirname)
            chmod +x $BIN_DIR/*
            echo "REAL_CLANG_BIN=$GITHUB_WORKSPACE/clang/$BIN_DIR" >> $GITHUB_ENV
          fi

      - name: Configure and Build Kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          
          # 使用上一步找到的 bin 路径
          export PATH="$REAL_CLANG_BIN:$PATH"
          
          # 打印验证
          echo "--- Checking Toolchain ---"
          which clang
          which ld.lld
          clang --version
          echo "--------------------------"
          
          # 配置编译
          make O=out ARCH=arm64 gki_defconfig
          
          # 满核编译
          make O=out ARCH=arm64 -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: K60-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
