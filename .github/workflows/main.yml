name: Build K60 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git flex bison libssl-dev libelf-dev bc cpio rsync wget unzip

      - name: Download Clang from My Release
        run: |
          mkdir clang && cd clang
          
          # 使用你刚刚上传的专属 Release 链接
          wget -q https://github.com/Can186/RedmiK60Pro/releases/download/clang/clang-r450784e-main.zip
          
          # 解压
          unzip -q clang-r450784e-main.zip
          
          # 把里层的文件全部挪到外层来
          mv clang-r450784e-main/* .
          rm -rf clang-r450784e-main clang-r450784e-main.zip
          
          # 赋予执行权限并验证
          chmod +x bin/*
          ls -la bin/clang

      - name: Configure and Build Kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          
          # 指向外层纯粹的 bin 目录
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # 打印验证
          echo "--- Checking Toolchain ---"
          which clang
          which ld.lld
          clang --version
          echo "--------------------------"
          
          # 配置（无需 savedefconfig）
          make O=out ARCH=arm64 gki_defconfig
          
          # 满核多线程编译
          make O=out ARCH=arm64 -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: K60-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
